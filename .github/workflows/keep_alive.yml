name: Extend PythonAnywhere WebApp

on:
  schedule:
    # מופעל כל יום ראשון ב-09:00 בבוקר
    - cron: '0 9 * * 0'
  # מאפשר לך להריץ את המשימה ידנית לבדיקה
  workflow_dispatch:

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - name: Extend webapp expiration
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://www.pythonanywhere.com/api/v0/user/eilam20/webapps/eilam20.pythonanywhere.com/extend/" \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Status Code: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to extend webapp!"
            exit 1
          fi
